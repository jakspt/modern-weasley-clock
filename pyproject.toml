[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "weasley_clock"
version = "0.1.0"
description = "An IoT version of the 'Weasley Clock' as seen in Harry Potter"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "adafruit-circuitpython-neopixel>=6.4.1",
    "board>=1.0",
    "geopy>=2.4.1",
    "gpiozero>=2.0.1",
    "jsonschema>=4.26.0",
    "paho-mqtt>=2.1.0",
    "pynput>=1.8.1",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "rpi-lgpio; sys_platform == 'linux'",
    "rpi_ws281x; sys_platform == 'linux'",
]
[project.scripts]
weasley_clock = "weasley_clock.main:main"
calibrate_clock = "weasley_clock.calibrate:calibrate_led_ring"

[dependency-groups]
dev = [
    "pyrefly>=0.59.1",
    "ruff>=0.15.8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
